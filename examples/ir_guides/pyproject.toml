[project]
name = "tirx-ir-guide-examples"
version = "0.1.0"
description = "The C++ and Rust examples of the IR Guides: functions that read and rewrite TIRx IR"
requires-python = ">=3.10"
dependencies = ["apache-tvm-tirx"]

[build-system]
# apache-tvm-tirx provides the CMake packages for the C++ library, and tvm-tirx-config and
# tvm-ffi-config, which the cargo build of the Rust library runs.
requires = ["scikit-build-core>=0.11", "apache-tvm-tirx"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.py-api = "py3"
wheel.packages = ["python/tirx_ir_guide_examples"]
cmake.build-type = "Release"
