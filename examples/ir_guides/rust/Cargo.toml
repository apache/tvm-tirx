[package]
name = "tirx-ir-guide-examples"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# The shared library that tirx_ir_guide_examples.rust loads.
name = "tirx_ir_guide_examples_rust"
crate-type = ["cdylib"]

[dependencies]
# Use the bindings from this checkout to match the current IR node fields.
tvm-tirx = { path = "../../../rust" }
