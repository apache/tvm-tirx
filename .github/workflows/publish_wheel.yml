name: Publish TIRx wheels

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, branch, or SHA to build"
        required: true
        type: string
      platform:
        description: "Build all platforms, or validate Windows ARM64 without publishing"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows-arm64
      publish_repository:
        description: "Where to publish after the wheel build succeeds"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - pypi

permissions:
  contents: read

# CI runners are ephemeral, so pip's HTTP cache buys nothing and a stale
# preinstalled cache (e.g. on the macOS image) only produces noisy
# "Cache entry deserialization failed" warnings. Disable it everywhere.
env:
  PIP_NO_CACHE_DIR: "1"

jobs:
  select_platforms:
    runs-on: ubuntu-latest
    outputs:
      cuda: ${{ steps.select.outputs.cuda }}
      wheels: ${{ steps.select.outputs.wheels }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag }}
      - name: Select wheel platforms
        id: select
        env:
          WHEEL_PLATFORM: ${{ inputs.platform }}
          PUBLISH_REPOSITORY: ${{ inputs.publish_repository }}
        run: python ci/wheel/select_wheel_platforms.py

  # Build the CUDA runtime sidecar once per arch and upload it as an artifact that
  # build_wheels bundles. The Linux legs build inside the official manylinux_2_28
  # CUDA image (CUDA toolkit preinstalled, see pypa/manylinux) -- the same glibc
  # baseline cibuildwheel targets for the wheel -- so the sidecar stays
  # ABI-compatible with the wheel's libtvm_runtime.so regardless of the exact tag.
  build_cuda_runtime:
    needs: [select_platforms]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select_platforms.outputs.cuda) }}
    steps:
      # The containerized Linux legs check out as root; mark the tree safe so git
      # (submodule init in checkout) does not bail on "dubious ownership".
      - name: Mark workspace safe for git
        if: runner.os == 'Linux'
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Checkout source
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          fetch-depth: 1
          fetch-tags: true

      # Windows has no manylinux interpreter; the script's pip install needs one.
      - name: Set up Python (Windows host)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.arch == 'ARM64' && '3.12' || '3.10' }}
          architecture: ${{ matrix.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Build CUDA runtime sidecar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ${{ matrix.script }}

      - name: Build CUDA runtime sidecar (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call ${{ matrix.script }} ${{ matrix.arch }}

      - name: Upload CUDA runtime sidecar
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tirx-cuda-runtime-${{ matrix.arch }}
          path: ${{ matrix.lib }}
          if-no-files-found: error

  build_wheels:
    name: ${{ matrix.name }}
    # All-or-nothing: a failed sidecar leg blocks the whole wheel matrix (a publish
    # needs both complete wheel sets anyway).
    needs: [select_platforms, build_cuda_runtime]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select_platforms.outputs.wheels) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          # Preserve the source history and tags for reproducible release builds.
          fetch-depth: 0
          fetch-tags: true

      # Land the sidecar where -DTVM_TIRX_PACKAGE_EXTRA_LIBS / cibuildwheel's /project
      # mount expects it. Skipped on CPU-only rows (macOS).
      - name: Download CUDA runtime sidecar
        if: ${{ matrix.include_cuda_runtime == '1' }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: tirx-cuda-runtime-${{ matrix.arch }}
          path: build-wheel-cuda/lib

      - name: Build and test native and LLVM targets wheels
        uses: ./.github/actions/build-wheel-for-publish
        with:
          arch: ${{ matrix.arch }}
          build: ${{ matrix.build }}
          cmake_defines: ${{ matrix.cmake_defines }}
          include_cuda_runtime: ${{ matrix.include_cuda_runtime }}

      - name: Report wheel sizes
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path

          lines = ["| Package | Wheel | Bytes | MiB |", "|---|---|---:|---:|"]
          for package, directory in [("Main", "wheelhouse"), ("LLVM targets", "wheelhouse-llvm-targets")]:
              for wheel in sorted(Path(directory).glob("*.whl")):
                  size = wheel.stat().st_size
                  lines.append(f"| {package} | {wheel.name} | {size:,} | {size / 2**20:.2f} |")
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          PYTHON

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tirx-wheel-${{ matrix.artifact_suffix }}
          path: wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload LLVM targets wheel artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tirx-llvm-targets-wheel-${{ matrix.artifact_suffix }}
          path: wheelhouse-llvm-targets/*.whl
          if-no-files-found: error

  upload_llvm_targets:
    name: Upload LLVM targets distributions
    needs: [build_wheels]
    if: ${{ inputs.publish_repository == 'pypi' }}
    runs-on: ubuntu-latest
    environment: pypi-llvm-targets
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: tirx-llvm-targets-wheel-*
          path: dist
          merge-multiple: true

      # Print wheel sizes for visibility only. We do not fail on the PyPI 100 MB
      # limit here -- the publish step's upload would surface that error directly.
      - name: Print wheel sizes
        shell: bash
        run: ls -alh dist/*.whl

      - name: Generate artifact attestation for wheels
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: dist/*

      - name: Publish package distributions to PyPI
        if: ${{ inputs.publish_repository == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true
          verbose: true

  upload_pypi:
    name: Upload native TIRx distributions
    needs: [build_wheels, upload_llvm_targets]
    if: ${{ inputs.publish_repository == 'pypi' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: tirx-wheel-*
          path: dist
          merge-multiple: true

      # Print wheel sizes for visibility only. We do not fail on the PyPI 100 MB
      # limit here -- the publish step's upload would surface that error directly.
      - name: Print wheel sizes
        shell: bash
        run: ls -alh dist/*.whl

      - name: Generate artifact attestation for wheels
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: dist/*

      - name: Publish package distributions to PyPI
        if: ${{ inputs.publish_repository == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true
          verbose: true
