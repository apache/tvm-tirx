# GH actions.
# We use it to cover windows and mac builds
# Jenkins is still the primary CI

name: CI

on:
  push:
    branches:
      - main
      - tirx-standalone-root  # Temporary standalone branch validation.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: CI-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  MacOS:
    if: >-
      ${{ github.repository == 'apache/tvm-tirx' || github.repository == 'apache/tvm' ||
          (github.repository == 'tqchen/tvm-dev' && github.ref == 'refs/heads/tirx-standalone-root') }}
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: 'recursive'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Prepare build and test environment
        shell: bash
        run: |
          uv sync --no-default-groups --group build --group test --no-install-project --no-install-package apache-tvm-ffi
          uv pip install --no-deps ./3rdparty/tvm-ffi
      - name: Detect environment variables
        id: env_vars
        uses: ./.github/actions/detect-env-vars
      - name: Build TIRx wheels
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.env_vars.outputs.cpu_count }}
        run: |
          set -euxo pipefail
          export CMAKE_ARGS="-DTVM_TIRX_USE_METAL=ON -DTVM_TIRX_BUILD_TESTS=OFF"
          uv build --wheel --out-dir dist . -v
          uv pip install --no-deps --force-reinstall dist/apache_tvm_tirx-*.whl
      - name: Test
        shell: bash
        run: >-
          uv run --no-sync python -m pytest -v tests/python/codegen/llvm/test_minimal.py
          tests/python/runtime/test_validate_wheel_library.py tests/python/script
      - name: Minimal Metal Compile-Only
        shell: bash
        run: |
          set -euxo pipefail
          uv run --no-sync python -m pytest -v -s 'tests/python/codegen/gpu_common/test_allreduce.py::test_allreduce_sum_compile'
          uv run --no-sync python -m pytest -v -s 'tests/python/backend/metal/codegen/test_basic.py::test_func_with_trailing_pod_params'
      - name: Minimal Metal Compile-and-Run
        shell: bash
        run: |
          set -euxo pipefail
          uv run --no-sync python -m pytest -v -s tests/python/backend/metal
          uv run --no-sync python -m pytest -v -s 'tests/python/codegen/gpu_common/test_intrinsics.py'
          uv run --no-sync python -m pytest -v -s 'tests/python/codegen/gpu_common/test_allreduce.py::test_allreduce_sum[dims0-metal]'

  Windows:
    if: >-
      ${{ github.repository == 'apache/tvm-tirx' || github.repository == 'apache/tvm' ||
          (github.repository == 'tqchen/tvm-dev' && github.ref == 'refs/heads/tirx-standalone-root') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: 'recursive'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Prepare build and test environment
        shell: bash
        run: |
          uv sync --no-default-groups --group build --group test --no-install-project --no-install-package apache-tvm-ffi
          uv pip install --no-deps ./3rdparty/tvm-ffi
      - name: Detect environment variables
        id: env_vars
        uses: ./.github/actions/detect-env-vars
      - name: Build and install TIRx
        shell: cmd /C call {0}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.env_vars.outputs.cpu_count }}
        run: |
          set CMAKE_ARGS=-DTVM_TIRX_BUILD_TESTS=OFF
          uv build --wheel --out-dir dist . -v || exit /b 1
          for %%w in (dist\apache_tvm_tirx-*.whl) do (
            uv pip install --no-deps --force-reinstall "%%w" || exit /b 1
          )
      - name: Test
        shell: cmd /C call {0}
        run: >-
          uv run --no-sync python -m pytest -v tests/python/codegen/llvm/test_minimal.py
          tests/python/runtime/test_validate_wheel_library.py tests/python/script
