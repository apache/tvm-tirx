name: Detect TVM FFI Version
description: Resolve the committed TVM FFI submodule to exactly one Apache release tag.
runs:
  using: composite
  steps:
    - name: Detect the TVM FFI release version
      id: detect
      shell: bash
      run: python ci/wheel/tvm_ffi_version.py detect
outputs:
  version:
    description: The release version without the v prefix.
    value: ${{ steps.detect.outputs.version }}
