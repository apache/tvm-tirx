[project]
name = "apache-tvm-tirx-llvm-targets"
version = "0.1.0a4"
description = "Additional LLVM code generation targets for TVM TIRx"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["apache-tvm-tirx==0.1.0a4"]

[build-system]
requires = [
  "scikit-build-core>=0.11",
  "mlc-llvm-static[all]==23.1.1.post0",
  "mlc-z3-static==5.3.1.post1",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.py-api = "py3"
build-dir = "build"
build.targets = ["tvm_tirx_llvm_backend"]
install.components = ["tvm_tirx_llvm_backend"]
wheel.packages = ["python/tvm_tirx_llvm_targets"]
wheel.install-dir = "tvm_tirx_llvm_targets"

[tool.scikit-build.cmake.define]
TVM_TIRX_BUILD_PYTHON_MODULE = "OFF"
TVM_TIRX_LLVM_NATIVE_ONLY = "OFF"

[tool.cibuildwheel]
skip = "*-win32 *-manylinux_i686 *-musllinux*"
build-verbosity = 1
test-requires = ["pytest", "numpy"]

# The matching main wheel supplies the compiler/runtime libraries. The optional
# LLVM backend does not link the CUDA runtime or its driver/toolkit dependencies.
[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair --exclude libtvm_ffi.so --exclude libtvm_tirx_compiler.so --exclude libtvm_runtime.so -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
# Preserve the repaired backend library's ad-hoc signature on arm64 macOS.
repair-wheel-command = '''
set -euo pipefail
DELOCATE_TMP_DIR="$(mktemp -d)"
delocate-wheel --ignore-missing-dependencies --exclude libtvm_ffi.dylib --require-archs {delocate_archs} -w "$DELOCATE_TMP_DIR" -v {wheel}
python -m pip install -q wheel
TMP_DIR="$(mktemp -d)"
python -m wheel unpack "$DELOCATE_TMP_DIR"/*.whl -d "$TMP_DIR"
find "$TMP_DIR" -type f \( -name "*.dylib" -o -name "*.so" \) -exec codesign --force --sign - {} +
python -m wheel pack "$TMP_DIR"/*/ -d {dest_dir}
rm -rf "$DELOCATE_TMP_DIR" "$TMP_DIR"
'''

[tool.cibuildwheel.windows]
before-build = 'python -m pip install "delvewheel>=1.12.0"'
repair-wheel-command = 'delvewheel repair --analyze-existing --ignore-existing --exclude "*tvm_ffi*.dll" --exclude tvm_tirx_compiler.dll --exclude tvm_runtime.dll -w {dest_dir} {wheel}'
